name: PR

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover models
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: List models
        id: find
        run: |
          MATRIX=$(find models -maxdepth 2 -name pyproject.toml \
            | xargs -n1 dirname | sort | jq -R . | jq -sc .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  ci:
    name: CI — ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "${{ matrix.package }}/uv.lock"
      - run: make -C ${{ matrix.package }} dev
      - run: make -C ${{ matrix.package }} check
      - run: make -C ${{ matrix.package }} test

  gate:
    name: CI
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.ci.result }}" = "success" ] || exit 1
